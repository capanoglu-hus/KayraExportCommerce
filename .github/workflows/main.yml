name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/v1.0.0'
      - 'prod/v1.0.0'

jobs:
  dotnet-build:
    name: .NET Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore KayraExportCommerce.slnx

      - name: Build
        run: dotnet build KayraExportCommerce.slnx --configuration Release --no-restore

  docker-build-check:
    name: Dockerfile Check
    runs-on: ubuntu-latest
    needs: dotnet-build 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Build
        run: docker compose build
